name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm repo:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 -m unittest discover -s scripts/sources -p 'test_*.py'
      - run: node --test scripts/sources/*.test.mjs
      - run: pnpm test:worker
      - run: pnpm build
      - run: pnpm check:cloudflare
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
