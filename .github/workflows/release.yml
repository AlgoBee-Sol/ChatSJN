name: Release live
run-name: Release ${{ inputs.commit_sha }} to live
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA of the successful current staging deployment
        required: true
        type: string
      apply_migrations:
        description: Apply reviewed database migrations (recovery plan checked)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  deployments: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require a successfully staged main commit
        run: node scripts/ci/release-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}

  deploy:
    name: Deploy live after approval
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://sjn-ai-beta.algobee-solutions.workers.dev
    env:
      CF_SEND_TELEMETRY: 'false'
      SJN_RELEASE_SHA: ${{ inputs.commit_sha }}
    steps:
      # Run the gate from the workflow revision, before checking out the release.
      - name: Require live deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN to the production GitHub environment; see docs/TEAM_WORKFLOW.md.'
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Recheck staging after release approval
        run: node scripts/ci/release-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cloudflare
      - run: pnpm exec cf deploy --prebuilt --mode production --dry-run
      - name: Apply explicitly requested live migrations
        if: inputs.apply_migrations
        run: node scripts/ci/migrations.mjs production apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Refuse deployment with pending migrations
        run: node scripts/ci/migrations.mjs production check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy approved release
        run: pnpm exec cf deploy --prebuilt --mode production --tag "$SJN_RELEASE_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live release
        run: pnpm smoke:production "$SJN_RELEASE_SHA"
